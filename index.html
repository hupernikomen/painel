<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Painel · Tesouraria ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --border: #e2e8f0;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;

      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #ecfdf5;

      --danger: #ef4444;
      --danger-light: #fef2f2;

      --warning: #f59e0b;
      --warning-light: #fffbeb;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
    }

    /* Layout Principal */
    .app-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header / Topbar */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
    }
    
    .top-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 4px rgba(16, 185, 129, 0.2);
    }

    .brand-info h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-info .user-email {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Navegação por Abas */
    .nav-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
    }

    .tabs {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab:hover {
      color: var(--text-main);
    }

    .tab.active {
      color: var(--primary-dark);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }

    /* Botões */
    button { font-family: 'Inter', sans-serif; border: 0; cursor: pointer; transition: all 0.15s ease; }
    
    .btn {
      height: 38px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .btn:hover {
      background: #f1f5f9;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }
    
    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .btn-danger {
      background: var(--danger-light);
      border-color: #fca5a5;
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    .btn-block {
      width: 100%;
      height: 44px;
      font-size: 14px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
    }

    .icon-btn:hover {
      background: var(--danger-light);
      color: var(--danger);
      border-color: #fca5a5;
    }

    /* Login Box */
    .login-container {
      max-width: 400px;
      margin: 60px auto;
    }

    .login {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .login h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .login p {
      margin: 0 0 24px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Dashboard KPIs Grid */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .kpi-info label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-info strong {
      display: block;
      margin-top: 8px;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .kpi-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      background: var(--bg-body);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kpi.warn {
      border-color: #fde68a;
      background: #fffbeb;
    }
    
    .kpi.warn strong { color: var(--warning); }
    .kpi.warn .kpi-icon { background: #fef3c7; color: var(--warning); }

    /* Banners de Alerta */
    .banner {
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner.ok {
      background: var(--primary-light);
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .banner.warn {
      background: var(--warning-light);
      border: 1px solid #fde68a;
      color: #92400e;
    }

    .banner.err {
      background: var(--danger-light);
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Cards e Listas */
    .stack { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease;
    }

    .card:hover {
      border-color: #cbd5e1;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .card-body { flex: 1; min-width: 0; }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
    }

    .card-sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-foot {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
    }

    .card-valor {
      font-weight: 700;
      color: var(--text-main);
      font-size: 15px;
    }

    /* Badges e Pills */
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #f1f5f9;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .pill.alert {
      background: var(--warning-light);
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .empty {
      background: var(--bg-surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .hidden { display: none !important; }

    /* Modal Profissional */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }

    .modal h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal p {
      margin: 0 0 20px;
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-actions .btn {
      height: 40px;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="top-header">
      <div class="top-container">
        <div class="brand-section">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div class="brand-info">
            <h1>Painel de Controle</h1>
            <p class="user-email" id="quem">Tesouraria</p>
          </div>
        </div>
        <div class="top-actions" id="acoes"></div>
      </div>
    </header>

    <!-- Navegação de Abas -->
    <nav class="nav-bar">
      <div class="tabs hidden" id="tabs">
        <button type="button" class="tab active" data-tab="resumo">Resumo</button>
        <button type="button" class="tab" data-tab="igrejas">Igrejas</button>
        <button type="button" class="tab" data-tab="membros">Membros</button>
        <button type="button" class="tab hidden" data-tab="orfaos" id="tabOrfaos">Órfãos</button>
      </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main id="app"></main>
  </div>

  <!-- Modal de Confirmação -->
  <div id="modalRoot" class="modal-bg hidden">
    <div class="modal">
      <h3 id="modalTitle">Confirmar Ação</h3>
      <p id="modalMsg">Você tem certeza que deseja prosseguir?</p>
      <div class="modal-actions">
        <button type="button" class="btn" id="modalCancel">Cancelar</button>
        <button type="button" class="btn btn-danger" id="modalOk">Confirmar Exclusão</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      deleteDoc,
      query,
      where,
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const EMAILS_PERMITIDOS = ["hupcontato@gmail.com"];
    const QTD_ULTIMOS = 3;

    const firebaseConfig = {
      apiKey: "AIzaSyDJFnhKXoUqKSIzsffYWkJ7qGIuEUhlUFs",
      authDomain: "psh-admin-8c0f7.firebaseapp.com",
      projectId: "psh-admin-8c0f7",
      storageBucket: "psh-admin-8c0f7.firebasestorage.app",
      messagingSenderId: "53234150017",
      appId: "1:53234150017:web:6e64b2536d79dff74b7b80",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const root = document.getElementById("app");
    const acoes = document.getElementById("acoes");
    const quem = document.getElementById("quem");
    const tabsEl = document.getElementById("tabs");
    const tabOrfaos = document.getElementById("tabOrfaos");
    const modalRoot = document.getElementById("modalRoot");
    const modalTitle = document.getElementById("modalTitle");
    const modalMsg = document.getElementById("modalMsg");
    const modalCancel = document.getElementById("modalCancel");
    const modalOk = document.getElementById("modalOk");

    let cache = { igrejas: [], membros: [], registros: [] };
    let pendingAction = null;
    let tabAtual = "resumo";

    const money = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL",
    });

    function emailOk(user) {
      const e = String(user?.email || "").trim().toLowerCase();
      return EMAILS_PERMITIDOS.map((x) => x.toLowerCase()).includes(e);
    }

    function dataTxt(ts) {
      const n = Number(ts) || 0;
      if (!n) return "—";
      const d = new Date(n);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function tsDe(item) {
      return Number(item?.reg || item?.data || item?.createdAt || 0) || 0;
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function valorRegistro(r) {
      if (r?.tipoMovimento === "saida") {
        return Number(r.valorPagoTotal || r.valorTotal || 0) || 0;
      }
      return Number(r.valorRecebidoTotal || r.valorTotal || 0) || 0;
    }

    function nomeIgrejaPorId(id, mapa) {
      if (!id) return { nome: "Sem igreja", orfao: true };
      const n = mapa.get(id);
      if (n) return { nome: n, orfao: false };
      return { nome: "Igreja não encontrada", orfao: true, id };
    }

    function iconTrash() {
      return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
    }

    function abrirModal(titulo, mensagem, onConfirm) {
      modalTitle.textContent = titulo;
      modalMsg.textContent = mensagem;
      pendingAction = onConfirm;
      modalRoot.classList.remove("hidden");
    }

    function fecharModal() {
      pendingAction = null;
      modalRoot.classList.add("hidden");
    }

    modalCancel.onclick = () => fecharModal();
    modalOk.onclick = async () => {
      const fn = pendingAction;
      fecharModal();
      if (!fn) return;
      try {
        await fn();
      } catch (e) {
        alert("Erro: " + (e?.message || e?.code || "falha"));
      }
    };
    modalRoot.addEventListener("click", (e) => {
      if (e.target === modalRoot) fecharModal();
    });

    async function apagarQuery(colName, field, value) {
      const q = query(collection(db, colName), where(field, "==", value));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
      return snap.size;
    }

    async function excluirIgrejaCompleta(igrejaId, nome) {
      if (!igrejaId) return;
      const nM = await apagarQuery("membros", "igrejaId", igrejaId);
      const nR = await apagarQuery("registros", "igrejaId", igrejaId);
      try {
        await apagarQuery("caixinhas", "igrejaId", igrejaId);
      } catch (_) {}
      await deleteDoc(doc(db, "igrejas", igrejaId));
      await carregar(true);
      alert('Igreja "' + nome + '" excluída.\nMembros: ' + nM + "\nRegistros: " + nR);
    }

    async function excluirRegistro(regId) {
      if (!regId) return;
      await deleteDoc(doc(db, "registros", regId));
      await carregar(true);
    }

    async function excluirMembro(membroId) {
      if (!membroId) return;
      await deleteDoc(doc(db, "membros", membroId));
      await carregar(true);
    }

    async function entrar() {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    }

    async function sair() {
      await signOut(auth);
    }

    function telaLogin(msg) {
      tabsEl.classList.add("hidden");
      acoes.innerHTML = "";
      quem.textContent = "Acesso Restrito";
      root.innerHTML =
        '<div class="login-container">' +
        '<section class="login">' +
        '<div class="login-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>' +
        "<h2>Painel de Gestão</h2>" +
        "<p>Autentique-se com uma conta corporativa autorizada para acessar.</p>" +
        (msg ? '<div class="banner warn">' + esc(msg) + "</div>" : "") +
        '<button type="button" class="btn btn-primary btn-block" id="btnEntrar">Entrar com Google</button>' +
        "</section>" +
        "</div>";
      document.getElementById("btnEntrar").onclick = () =>
        entrar().catch((e) =>
          telaLogin(e?.message || "Não foi possível entrar.")
        );
    }

    function prepararDados() {
      const { igrejas, membros, registros } = cache;
      const mapaNome = new Map(igrejas.map((i) => [i.id, i.nome || "Igreja"]));

      const membrosPorIgreja = {};
      membros.forEach((m) => {
        const id = m.igrejaId || "—";
        membrosPorIgreja[id] = (membrosPorIgreja[id] || 0) + 1;
      });

      const ultimoPorIgreja = {};
      const orfaos = [];

      registros.forEach((r) => {
        const ts = tsDe(r);
        const id = r.igrejaId || "";
        if (!id || !mapaNome.has(id)) {
          orfaos.push(r);
          return;
        }
        if (!ultimoPorIgreja[id] || ts > ultimoPorIgreja[id].ts) {
          ultimoPorIgreja[id] = { ts, item: r };
        }
      });

      const ultimos = [...registros]
        .sort((a, b) => tsDe(b) - tsDe(a))
        .slice(0, QTD_ULTIMOS);

      const linhasIgreja = igrejas
        .map((ig) => {
          const ultIg = ultimoPorIgreja[ig.id];
          return {
            id: ig.id,
            nome: ig.nome || "Igreja",
            membros: membrosPorIgreja[ig.id] || 0,
            ultimo: ultIg?.ts || 0,
            tipo: ultIg?.item?.tipo || "—",
            desc: ultIg?.item?.descricao || "—",
            exclusao: Number(ig.exclusaoPrevistaEm) || 0,
          };
        })
        .sort((a, b) => b.ultimo - a.ultimo);

      const membrosLinhas = membros
        .map((m) => {
          const info = nomeIgrejaPorId(m.igrejaId, mapaNome);
          return {
            id: m.id,
            email: m.email || m.uid || "—",
            papel: m.papel || "—",
            igreja: info.nome,
            orfao: info.orfao,
          };
        })
        .sort((a, b) => String(a.email).localeCompare(String(b.email)));

      orfaos.sort((a, b) => tsDe(b) - tsDe(a));

      return {
        mapaNome,
        orfaos,
        ultimos,
        linhasIgreja,
        membrosLinhas,
      };
    }

    function bindDeletes() {
      root.querySelectorAll("[data-del-igreja]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-del-igreja");
          const nome = btn.getAttribute("data-nome") || id;
          abrirModal(
            "Excluir igreja?",
            'Vai apagar "' +
              nome +
              '" e tudo ligado a ela (membros, registros e caixinhas). Não tem como desfazer aqui.',
            () => excluirIgrejaCompleta(id, nome)
          );
        };
      });

      root.querySelectorAll("[data-del-reg]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-del-reg");
          abrirModal(
            "Excluir registro?",
            "Este lançamento será removido do Firestore imediatamente.",
            () => excluirRegistro(id)
          );
        };
      });

      root.querySelectorAll("[data-del-membro]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-del-membro");
          abrirModal(
            "Remover membro?",
            "Só remove o vínculo com a igreja. A conta do Google continua existindo.",
            () => excluirMembro(id)
          );
        };
      });
    }

    function cardLancamento(item, mapaNome) {
      const info = nomeIgrejaPorId(item.igrejaId, mapaNome);
      return (
        '<div class="card">' +
        '<div class="card-row">' +
        '<div class="card-body">' +
        '<div class="card-title">' +
        esc(item.descricao || item.tipo || "Lançamento") +
        "</div>" +
        '<div class="card-sub">' +
        "<span>" + esc(info.nome) + "</span> · " +
        "<span>" + esc(item.tipoMovimento || "—") + "</span> · " +
        "<span>" + esc(item.tipo || "—") + "</span>" +
        "</div>" +
        '<div class="card-foot">' +
        "<span>" + esc(dataTxt(tsDe(item))) + "</span>" +
        '<div style="display:flex;align-items:center;gap:10px;">' +
        '<span class="card-valor">' + money.format(valorRegistro(item)) + "</span>" +
        (info.orfao ? '<span class="pill alert">órfão</span>' : "") +
        "</div>" +
        "</div>" +
        "</div>" +
        '<button type="button" class="icon-btn" data-del-reg="' +
        esc(item.id) +
        '" title="Excluir" aria-label="Excluir registro">' +
        iconTrash() +
        "</button>" +
        "</div>" +
        "</div>"
      );
    }

    function renderResumo(prep) {
      const { orfaos, ultimos, mapaNome } = prep;
      const { igrejas, membros, registros } = cache;

      let html =
        '<div class="kpis">' +
        '<div class="kpi"><div class="kpi-info"><label>Igrejas</label><strong>' + igrejas.length + '</strong></div><div class="kpi-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M3 7v14M21 7v14M6 21V11m4 10V11m4 10V11m4 10V11M12 3l9 4H3l9-4z"/></svg></div></div>' +
        '<div class="kpi"><div class="kpi-info"><label>Membros</label><strong>' + membros.length + '</strong></div><div class="kpi-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div></div>' +
        '<div class="kpi"><div class="kpi-info"><label>Registros</label><strong>' + registros.length + '</strong></div><div class="kpi-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/></svg></div></div>' +
        '<div class="kpi' + (orfaos.length ? " warn" : "") + '"><div class="kpi-info"><label>Órfãos</label><strong>' + orfaos.length + '</strong></div><div class="kpi-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></div></div>' +
        "</div>";

      if (orfaos.length) {
        html += '<div class="banner warn"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg> Há registros desvinculados de igrejas válidas. Acesse a aba Órfãos.</div>';
      } else {
        html += '<div class="banner ok"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Sistema operando perfeitamente. Nenhum registro órfão.</div>';
      }

      html += '<div class="section-header"><div class="section-title">Últimos ' + QTD_ULTIMOS + " Lançamentos</div></div>";

      if (!ultimos.length) {
        html += '<div class="empty">Nenhum lançamento cadastrado até o momento.</div>';
      } else {
        html += '<div class="stack">' + ultimos.map((item) => cardLancamento(item, mapaNome)).join("") + "</div>";
      }

      return html;
    }

    function renderIgrejas(prep) {
      const list = prep.linhasIgreja;
      if (!list.length) {
        return '<div class="empty">Nenhuma igreja cadastrada.</div>';
      }

      return (
        '<div class="stack">' +
        list
          .map((ig) => {
            return (
              '<div class="card">' +
              '<div class="card-row">' +
              '<div class="card-body">' +
              '<div class="card-title">' + esc(ig.nome) + "</div>" +
              '<div class="card-sub">' + ig.membros + " membro(s) cadastrado(s)</div>" +
              '<div class="card-foot">' +
              "<span>Última movimentação: " + esc(dataTxt(ig.ultimo)) + "</span>" +
              (ig.tipo && ig.tipo !== "—" ? '<span class="pill">' + esc(ig.tipo) + "</span>" : "") +
              (ig.exclusao ? '<span class="pill alert">Exclusão em: ' + esc(dataTxt(ig.exclusao)) + "</span>" : "") +
              "</div>" +
              "</div>" +
              '<button type="button" class="icon-btn" data-del-igreja="' + esc(ig.id) + '" data-nome="' + esc(ig.nome) + '" title="Excluir igreja" aria-label="Excluir igreja">' +
              iconTrash() +
              "</button>" +
              "</div>" +
              "</div>"
            );
          })
          .join("") +
        "</div>"
      );
    }

    function renderMembros(prep) {
      const list = prep.membrosLinhas;
      if (!list.length) return '<div class="empty">Nenhum membro cadastrado.</div>';

      return (
        '<div class="stack">' +
        list
          .map((m) => {
            return (
              '<div class="card">' +
              '<div class="card-row">' +
              '<div class="card-body">' +
              '<div class="card-title">' + esc(m.email) + "</div>" +
              '<div class="card-sub">' + esc(m.igreja) + "</div>" +
              '<div class="card-foot">' +
              '<span class="pill">' + esc(m.papel) + "</span>" +
              (m.orfao ? '<span class="pill alert">Igreja não encontrada</span>' : "") +
              "</div>" +
              "</div>" +
              '<button type="button" class="icon-btn" data-del-membro="' + esc(m.id) + '" title="Remover membro" aria-label="Remover membro">' +
              iconTrash() +
              "</button>" +
              "</div>" +
              "</div>"
            );
          })
          .join("") +
        "</div>"
      );
    }

    function renderOrfaos(prep) {
      const list = prep.orfaos;
      if (!list.length) {
        return '<div class="empty">Nenhum registro órfão.</div>';
      }

      return (
        '<div class="banner warn">Estes lançamentos estão sem vinculação com uma igreja válida.</div>' +
        '<div class="stack">' +
        list.map((r) => cardLancamento(r, prep.mapaNome)).join("") +
        "</div>"
      );
    }

    function render() {
      const prep = prepararDados();

      if (prep.orfaos.length) {
        tabOrfaos.classList.remove("hidden");
        tabOrfaos.textContent = "Órfãos (" + prep.orfaos.length + ")";
      } else {
        tabOrfaos.classList.add("hidden");
        if (tabAtual === "orfaos") tabAtual = "resumo";
      }

      tabsEl.querySelectorAll(".tab").forEach((t) => {
        t.classList.toggle("active", t.getAttribute("data-tab") === tabAtual);
      });

      if (tabAtual === "igrejas") root.innerHTML = renderIgrejas(prep);
      else if (tabAtual === "membros") root.innerHTML = renderMembros(prep);
      else if (tabAtual === "orfaos") root.innerHTML = renderOrfaos(prep);
      else root.innerHTML = renderResumo(prep);

      bindDeletes();
    }

    tabsEl.querySelectorAll(".tab").forEach((t) => {
      t.onclick = () => {
        tabAtual = t.getAttribute("data-tab");
        render();
      };
    });

    async function carregar(silencioso) {
      if (!silencioso) {
        root.innerHTML =
          '<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:14px;">Carregando dados...</div>';
      }
      const [igrejasSnap, membrosSnap, registrosSnap] = await Promise.all([
        getDocs(collection(db, "igrejas")),
        getDocs(collection(db, "membros")),
        getDocs(collection(db, "registros")),
      ]);

      cache = {
        igrejas: igrejasSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
        membros: membrosSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
        registros: registrosSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      };
      render();
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        telaLogin("");
        return;
      }
      if (!emailOk(user)) {
        await sair();
        telaLogin("Esta conta não tem permissão de acesso ao painel.");
        return;
      }

      quem.textContent = user.email || "";
      tabsEl.classList.remove("hidden");
      acoes.innerHTML =
        '<button type="button" class="btn" id="btnRefresh"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Atualizar</button>' +
        '<button type="button" class="btn btn-danger" id="btnSair">Sair</button>';
      document.getElementById("btnSair").onclick = () => sair();
      document.getElementById("btnRefresh").onclick = () => carregar();

      try {
        await carregar();
      } catch (e) {
        root.innerHTML =
          '<div class="banner err">Não foi possível carregar as informações do servidor (' +
          esc(e?.code || e?.message || "erro") +
          ").</div>";
      }
    });
  </script>
</body>
</html>
