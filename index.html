<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Painel · Tesouraria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --green: #65c556;
      --red: #dc2626;
      --orange: #d97706;
      --soft: #f9fafb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    /* Header */
    .top {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .top h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .top .email {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }
    .top-actions { display: flex; gap: 8px; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      border: 0;
      background: var(--soft);
      color: var(--muted);
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab.active {
      background: var(--green);
      color: #fff;
    }

    /* Buttons */
    button {
      font-family: inherit;
      border: 0;
      cursor: pointer;
    }
    .btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      background: var(--soft);
      color: var(--ink);
    }
    .btn-primary {
      background: var(--green);
      color: #fff;
    }
    .btn-danger {
      background: #fef2f2;
      color: var(--red);
    }
    .btn-block {
      width: 100%;
      height: 48px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-btn.danger:active,
    .icon-btn.danger:hover {
      background: #fef2f2;
      color: var(--red);
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: max(28px, env(safe-area-inset-bottom));
    }

    /* Login */
    .login {
      margin-top: 40px;
      background: var(--card);
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
    }
    .login h2 { margin: 0 0 8px; font-size: 22px; }
    .login p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* KPI */
    .kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .kpi {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
    }
    .kpi label {
      display: block;
      font-size: 12px;
      color: var(--muted);
    }
    .kpi strong {
      display: block;
      margin-top: 6px;
      font-size: 22px;
      font-weight: 700;
    }
    .kpi.warn strong { color: var(--orange); }

    /* Banner */
    .banner {
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 14px;
    }
    .banner.ok { background: #ecfdf5; color: #047857; }
    .banner.warn { background: #fffbeb; color: #b45309; }
    .banner.err { background: #fef2f2; color: #b91c1c; }

    /* Section */
    .section-title {
      margin: 8px 2px 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Cards list */
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
    }
    .card-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }
    .card-sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
      word-break: break-word;
    }
    .card-foot {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--soft);
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }
    .pill.alert {
      background: #fffbeb;
      color: var(--orange);
    }
    .empty {
      background: var(--card);
      border-radius: 16px;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .hidden { display: none !important; }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    @media (min-width: 520px) {
      .modal-bg { align-items: center; }
    }
    .modal {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 18px;
      padding: 20px;
    }
    .modal h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }
    .modal p {
      margin: 0 0 18px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .modal-actions .btn {
      flex: 1;
      height: 44px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="top" id="topBar">
    <div class="top-row">
      <div>
        <h1>Painel</h1>
        <p class="email" id="quem">Tesouraria</p>
      </div>
      <div class="top-actions" id="acoes"></div>
    </div>
    <div class="tabs hidden" id="tabs">
      <button type="button" class="tab active" data-tab="resumo">Resumo</button>
      <button type="button" class="tab" data-tab="igrejas">Igrejas</button>
      <button type="button" class="tab" data-tab="membros">Membros</button>
      <button type="button" class="tab hidden" data-tab="orfaos" id="tabOrfaos">Órfãos</button>
    </div>
  </div>

  <main id="app"></main>

  <div id="modalRoot" class="modal-bg hidden">
    <div class="modal">
      <h3 id="modalTitle">Confirmar</h3>
      <p id="modalMsg"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="modalCancel">Cancelar</button>
        <button type="button" class="btn btn-danger" id="modalOk">Excluir</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      deleteDoc,
      query,
      where,
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const EMAILS_PERMITIDOS = ["hupcontato@gmail.com"];

    const firebaseConfig = {
      apiKey: "AIzaSyDJFnhKXoUqKSIzsffYWkJ7qGIuEUhlUFs",
      authDomain: "psh-admin-8c0f7.firebaseapp.com",
      projectId: "psh-admin-8c0f7",
      storageBucket: "psh-admin-8c0f7.firebasestorage.app",
      messagingSenderId: "53234150017",
      appId: "1:53234150017:web:6e64b2536d79dff74b7b80",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const root = document.getElementById("app");
    const acoes = document.getElementById("acoes");
    const quem = document.getElementById("quem");
    const tabsEl = document.getElementById("tabs");
    const tabOrfaos = document.getElementById("tabOrfaos");
    const modalRoot = document.getElementById("modalRoot");
    const modalTitle = document.getElementById("modalTitle");
    const modalMsg = document.getElementById("modalMsg");
    const modalCancel = document.getElementById("modalCancel");
    const modalOk = document.getElementById("modalOk");

    let cache = { igrejas: [], membros: [], registros: [] };
    let pendingAction = null;
    let tabAtual = "resumo";

    const money = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL",
    });

    function emailOk(user) {
      const e = String(user?.email || "").trim().toLowerCase();
      return EMAILS_PERMITIDOS.map((x) => x.toLowerCase()).includes(e);
    }

    function dataTxt(ts) {
      const n = Number(ts) || 0;
      if (!n) return "—";
      const d = new Date(n);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function tsDe(item) {
      return Number(item?.reg || item?.data || item?.createdAt || 0) || 0;
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function valorRegistro(r) {
      if (r?.tipoMovimento === "saida") {
        return Number(r.valorPagoTotal || r.valorTotal || 0) || 0;
      }
      return Number(r.valorRecebidoTotal || r.valorTotal || 0) || 0;
    }

    function nomeIgrejaPorId(id, mapa) {
      if (!id) return { nome: "Sem igreja", orfao: true };
      const n = mapa.get(id);
      if (n) return { nome: n, orfao: false };
      return { nome: "Igreja não encontrada", orfao: true, id };
    }

    function iconTrash() {
      return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
    }

    function abrirModal(titulo, mensagem, onConfirm) {
      modalTitle.textContent = titulo;
      modalMsg.textContent = mensagem;
      pendingAction = onConfirm;
      modalRoot.classList.remove("hidden");
    }

    function fecharModal() {
      pendingAction = null;
      modalRoot.classList.add("hidden");
    }

    modalCancel.onclick = () => fecharModal();
    modalOk.onclick = async () => {
      const fn = pendingAction;
      fecharModal();
      if (!fn) return;
      try {
        await fn();
      } catch (e) {
        alert("Erro: " + (e?.message || e?.code || "falha"));
      }
    };
    modalRoot.addEventListener("click", (e) => {
      if (e.target === modalRoot) fecharModal();
    });

    async function apagarQuery(colName, field, value) {
      const q = query(collection(db, colName), where(field, "==", value));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
      return snap.size;
    }

    async function excluirIgrejaCompleta(igrejaId, nome) {
      if (!igrejaId) return;
      const nM = await apagarQuery("membros", "igrejaId", igrejaId);
      const nR = await apagarQuery("registros", "igrejaId", igrejaId);
      try {
        await apagarQuery("caixinhas", "igrejaId", igrejaId);
      } catch (_) {}
      await deleteDoc(doc(db, "igrejas", igrejaId));
      await carregar(true);
      alert('Igreja "' + nome + '" excluída.\nMembros: ' + nM + "\nRegistros: " + nR);
    }

    async function excluirRegistro(regId) {
      if (!regId) return;
      await deleteDoc(doc(db, "registros", regId));
      await carregar(true);
    }

    async function excluirMembro(membroId) {
      if (!membroId) return;
      await deleteDoc(doc(db, "membros", membroId));
      await carregar(true);
    }

    async function entrar() {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    }

    async function sair() {
      await signOut(auth);
    }

    function telaLogin(msg) {
      tabsEl.classList.add("hidden");
      acoes.innerHTML = "";
      quem.textContent = "Acesso restrito";
      root.innerHTML =
        '<section class="login">' +
        "<h2>Painel do criador</h2>" +
        "<p>Entre com a conta Google autorizada para ver igrejas, membros e registros.</p>" +
        (msg ? '<div class="banner warn">' + esc(msg) + "</div>" : "") +
        '<button type="button" class="btn btn-primary btn-block" id="btnEntrar">Entrar com Google</button>' +
        "</section>";
      document.getElementById("btnEntrar").onclick = () =>
        entrar().catch((e) =>
          telaLogin(e?.message || "Não foi possível entrar.")
        );
    }

    function prepararDados() {
      const { igrejas, membros, registros } = cache;
      const mapaNome = new Map(igrejas.map((i) => [i.id, i.nome || "Igreja"]));

      const membrosPorIgreja = {};
      membros.forEach((m) => {
        const id = m.igrejaId || "—";
        membrosPorIgreja[id] = (membrosPorIgreja[id] || 0) + 1;
      });

      const ultimoPorIgreja = {};
      const orfaos = [];

      registros.forEach((r) => {
        const ts = tsDe(r);
        const id = r.igrejaId || "";
        if (!id || !mapaNome.has(id)) {
          orfaos.push(r);
          return;
        }
        if (!ultimoPorIgreja[id] || ts > ultimoPorIgreja[id].ts) {
          ultimoPorIgreja[id] = { ts, item: r };
        }
      });

      const ultimoGeral = registros.reduce((acc, r) => {
        const ts = tsDe(r);
        if (!acc || ts > acc.ts) return { ts, item: r };
        return acc;
      }, null);

      const linhasIgreja = igrejas
        .map((ig) => {
          const ultIg = ultimoPorIgreja[ig.id];
          return {
            id: ig.id,
            nome: ig.nome || "Igreja",
            membros: membrosPorIgreja[ig.id] || 0,
            ultimo: ultIg?.ts || 0,
            tipo: ultIg?.item?.tipo || "—",
            desc: ultIg?.item?.descricao || "—",
            exclusao: Number(ig.exclusaoPrevistaEm) || 0,
          };
        })
        .sort((a, b) => b.ultimo - a.ultimo);

      const membrosLinhas = membros
        .map((m) => {
          const info = nomeIgrejaPorId(m.igrejaId, mapaNome);
          return {
            id: m.id,
            email: m.email || m.uid || "—",
            papel: m.papel || "—",
            igreja: info.nome,
            orfao: info.orfao,
          };
        })
        .sort((a, b) => String(a.email).localeCompare(String(b.email)));

      orfaos.sort((a, b) => tsDe(b) - tsDe(a));

      return {
        mapaNome,
        orfaos,
        ultimoGeral,
        linhasIgreja,
        membrosLinhas,
      };
    }

    function bindDeletes() {
      root.querySelectorAll("[data-del-igreja]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-del-igreja");
          const nome = btn.getAttribute("data-nome") || id;
          abrirModal(
            "Excluir igreja?",
            'Vai apagar "' +
              nome +
              '" e tudo ligado a ela (membros, registros e caixinhas). Não tem como desfazer aqui.',
            () => excluirIgrejaCompleta(id, nome)
          );
        };
      });

      root.querySelectorAll("[data-del-reg]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-del-reg");
          abrirModal(
            "Excluir registro?",
            "Este lançamento será removido do Firestore imediatamente.",
            () => excluirRegistro(id)
          );
        };
      });

      root.querySelectorAll("[data-del-membro]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-del-membro");
          abrirModal(
            "Remover membro?",
            "Só remove o vínculo com a igreja. A conta do Google continua existindo.",
            () => excluirMembro(id)
          );
        };
      });
    }

    function renderResumo(prep) {
      const { orfaos, ultimoGeral, mapaNome } = prep;
      const { igrejas, membros, registros } = cache;
      const ult = ultimoGeral?.item;
      const info = nomeIgrejaPorId(ult?.igrejaId, mapaNome);

      let html =
        '<div class="kpis">' +
        '<div class="kpi"><label>Igrejas</label><strong>' +
        igrejas.length +
        "</strong></div>" +
        '<div class="kpi"><label>Membros</label><strong>' +
        membros.length +
        "</strong></div>" +
        '<div class="kpi"><label>Registros</label><strong>' +
        registros.length +
        "</strong></div>" +
        '<div class="kpi' +
        (orfaos.length ? " warn" : "") +
        '"><label>Órfãos</label><strong>' +
        orfaos.length +
        "</strong></div>" +
        "</div>";

      if (orfaos.length) {
        html +=
          '<div class="banner warn">Existem registros sem igreja válida. Veja a aba Órfãos.</div>';
      } else {
        html += '<div class="banner ok">Nenhum registro órfão.</div>';
      }

      html += '<div class="section-title">Último lançamento</div>';

      if (!ult) {
        html += '<div class="empty">Nenhum lançamento ainda.</div>';
      } else {
        html +=
          '<div class="card">' +
          '<div class="card-row">' +
          '<div class="card-body">' +
          '<div class="card-title">' +
          esc(ult.descricao || ult.tipo || "Lançamento") +
          "</div>" +
          '<div class="card-sub">' +
          esc(info.nome) +
          " · " +
          esc(ult.tipoMovimento || "—") +
          " · " +
          esc(ult.tipo || "—") +
          "</div>" +
          '<div class="card-foot">' +
          "<span>" +
          esc(dataTxt(ultimoGeral.ts)) +
          "</span>" +
          "<span>" +
          money.format(valorRegistro(ult)) +
          "</span>" +
          (info.orfao ? '<span class="pill alert">órfão</span>' : "") +
          "</div>" +
          "</div>" +
          '<button type="button" class="icon-btn danger" data-del-reg="' +
          esc(ult.id) +
          '" title="Excluir" aria-label="Excluir registro">' +
          iconTrash() +
          "</button>" +
          "</div>" +
          "</div>";
      }

      return html;
    }

    function renderIgrejas(prep) {
      const list = prep.linhasIgreja;
      if (!list.length) return '<div class="empty">Nenhuma igreja cadastrada.</div>';

      return (
        '<div class="stack">' +
        list
          .map((ig) => {
            return (
              '<div class="card">' +
              '<div class="card-row">' +
              '<div class="card-body">' +
              '<div class="card-title">' +
              esc(ig.nome) +
              "</div>" +
              '<div class="card-sub">' +
              ig.membros +
              " membro(s) · último: " +
              esc(dataTxt(ig.ultimo)) +
              "</div>" +
              '<div class="card-foot">' +
              "<span>" +
              esc(ig.tipo) +
              (ig.desc && ig.desc !== "—" ? " · " + esc(ig.desc) : "") +
              "</span>" +
              (ig.exclusao
                ? '<span class="pill alert">exclui em ' +
                  esc(dataTxt(ig.exclusao)) +
                  "</span>"
                : "") +
              "</div>" +
              "</div>" +
              '<button type="button" class="icon-btn danger" data-del-igreja="' +
              esc(ig.id) +
              '" data-nome="' +
              esc(ig.nome) +
              '" title="Excluir igreja" aria-label="Excluir igreja">' +
              iconTrash() +
              "</button>" +
              "</div>" +
              "</div>"
            );
          })
          .join("") +
        "</div>"
      );
    }

    function renderMembros(prep) {
      const list = prep.membrosLinhas;
      if (!list.length) return '<div class="empty">Nenhum membro.</div>';

      return (
        '<div class="stack">' +
        list
          .map((m) => {
            return (
              '<div class="card">' +
              '<div class="card-row">' +
              '<div class="card-body">' +
              '<div class="card-title">' +
              esc(m.email) +
              "</div>" +
              '<div class="card-sub">' +
              esc(m.igreja) +
              "</div>" +
              '<div class="card-foot">' +
              '<span class="pill">' +
              esc(m.papel) +
              "</span>" +
              (m.orfao ? '<span class="pill alert">igreja órfã</span>' : "") +
              "</div>" +
              "</div>" +
              '<button type="button" class="icon-btn danger" data-del-membro="' +
              esc(m.id) +
              '" title="Remover membro" aria-label="Remover membro">' +
              iconTrash() +
              "</button>" +
              "</div>" +
              "</div>"
            );
          })
          .join("") +
        "</div>"
      );
    }

    function renderOrfaos(prep) {
      const list = prep.orfaos;
      if (!list.length) {
        return '<div class="empty">Nenhum registro órfão.</div>';
      }

      return (
        '<div class="banner warn">Estes lançamentos não têm igreja válida no banco.</div>' +
        '<div class="stack">' +
        list
          .map((r) => {
            return (
              '<div class="card">' +
              '<div class="card-row">' +
              '<div class="card-body">' +
              '<div class="card-title">' +
              esc(r.descricao || r.tipo || "Registro") +
              "</div>" +
              '<div class="card-sub">' +
              esc(r.tipoMovimento || "—") +
              " · " +
              esc(r.tipo || "—") +
              "</div>" +
              '<div class="card-foot">' +
              "<span>" +
              esc(dataTxt(tsDe(r))) +
              "</span>" +
              "<span>" +
              money.format(valorRegistro(r)) +
              "</span>" +
              "</div>" +
              "</div>" +
              '<button type="button" class="icon-btn danger" data-del-reg="' +
              esc(r.id) +
              '" title="Excluir" aria-label="Excluir registro">' +
              iconTrash() +
              "</button>" +
              "</div>" +
              "</div>"
            );
          })
          .join("") +
        "</div>"
      );
    }

    function render() {
      const prep = prepararDados();

      if (prep.orfaos.length) {
        tabOrfaos.classList.remove("hidden");
        tabOrfaos.textContent = "Órfãos (" + prep.orfaos.length + ")";
      } else {
        tabOrfaos.classList.add("hidden");
        if (tabAtual === "orfaos") tabAtual = "resumo";
      }

      tabsEl.querySelectorAll(".tab").forEach((t) => {
        t.classList.toggle("active", t.getAttribute("data-tab") === tabAtual);
      });

      if (tabAtual === "igrejas") root.innerHTML = renderIgrejas(prep);
      else if (tabAtual === "membros") root.innerHTML = renderMembros(prep);
      else if (tabAtual === "orfaos") root.innerHTML = renderOrfaos(prep);
      else root.innerHTML = renderResumo(prep);

      bindDeletes();
    }

    tabsEl.querySelectorAll(".tab").forEach((t) => {
      t.onclick = () => {
        tabAtual = t.getAttribute("data-tab");
        render();
      };
    });

    async function carregar(silencioso) {
      if (!silencioso) {
        root.innerHTML = '<p style="color:#6b7280;font-size:14px">Carregando…</p>';
      }
      const [igrejasSnap, membrosSnap, registrosSnap] = await Promise.all([
        getDocs(collection(db, "igrejas")),
        getDocs(collection(db, "membros")),
        getDocs(collection(db, "registros")),
      ]);

      cache = {
        igrejas: igrejasSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
        membros: membrosSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
        registros: registrosSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      };
      render();
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        telaLogin("");
        return;
      }
      if (!emailOk(user)) {
        await sair();
        telaLogin("Esta conta não tem acesso ao painel.");
        return;
      }

      quem.textContent = user.email || "";
      tabsEl.classList.remove("hidden");
      acoes.innerHTML =
        '<button type="button" class="btn" id="btnRefresh">Atualizar</button>' +
        '<button type="button" class="btn" id="btnSair">Sair</button>';
      document.getElementById("btnSair").onclick = () => sair();
      document.getElementById("btnRefresh").onclick = () => carregar();

      try {
        await carregar();
      } catch (e) {
        root.innerHTML =
          '<div class="banner err">Não foi possível ler os dados (' +
          esc(e?.code || e?.message || "erro") +
          ").</div>";
      }
    });
  </script>
</body>
</html>
