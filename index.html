<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Painel · Tesouraria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f5f7;
      --ink: #1f2933;
      --muted: #8a9199;
      --line: #ececec;
      --green: #65c556;
      --red: #c62828;
      --orange: #e65100;
      --warn-bg: #fff3e0;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      padding-top: max(14px, env(safe-area-inset-top));
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { margin: 0; font-size: 17px; font-weight: 700; }
    .sub {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }
    #acoes { display: flex; gap: 8px; flex-shrink: 0; }
    button {
      border: 0;
      border-radius: 12px;
      height: 36px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: default; }
    .btn { background: var(--green); color: #fff; }
    .btn-ghost { background: #f4f5f7; color: #333; }
    .btn-danger { background: #ffebee; color: var(--red); }
    .btn-sm { height: 34px; padding: 0 12px; font-size: 12px; border-radius: 10px; }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 16px 14px 72px;
      padding-bottom: max(72px, env(safe-area-inset-bottom));
    }
    .login {
      max-width: 420px;
      margin: 32px auto;
      background: var(--card);
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
    }
    .login h2 { margin: 0 0 8px; font-size: 20px; }
    .login p { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }
    .kpi {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
    }
    .kpi span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 300;
    }
    .kpi strong {
      display: block;
      margin-top: 6px;
      font-size: 22px;
    }
    .kpi.warn strong { color: var(--orange); }
    h3 {
      margin: 20px 4px 10px;
      font-size: 12px;
      font-weight: 500;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .hint-select {
      margin: -4px 4px 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
    }
    .item:active { background: #fafafa; }
    .item.selected {
      border-color: var(--green);
      background: #f8fff7;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .item-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.3;
      word-break: break-word;
    }
    .item-meta {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      word-break: break-word;
    }
    .item-meta strong { color: var(--ink); font-weight: 500; }
    .item-side {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
      max-width: 42%;
    }
    .item-actions {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      gap: 8px;
      flex-wrap: wrap;
    }
    .item.selected .item-actions { display: flex; }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 8px;
      background: #fff3e0;
      color: var(--orange);
      margin-top: 6px;
    }
    .err, .aviso, .ok {
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .err, .aviso { background: var(--warn-bg); color: var(--orange); }
    .ok { background: #e8f5e9; color: #2e7d32; }
    .muted { color: var(--muted); font-weight: 300; font-size: 12px; }
    .detail-card {
      background: var(--card);
      border-radius: 16px;
      padding: 4px 0;
      margin-bottom: 8px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }
    .detail-row:last-child { border-bottom: 0; }
    .detail-row span:first-child {
      color: var(--muted);
      font-size: 12px;
      flex-shrink: 0;
    }
    .detail-row span:last-child {
      text-align: right;
      word-break: break-word;
    }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
    @media (min-width: 560px) {
      .modal-bg { align-items: center; }
    }
    .modal {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 20px;
    }
    .modal h4 { margin: 0 0 8px; font-size: 17px; }
    .modal p {
      margin: 0 0 16px;
      font-size: 14px;
      color: #555;
      line-height: 1.45;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: stretch;
    }
    .modal-actions button { flex: 1; height: 44px; }
    .hidden { display: none !important; }
    .empty {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Painel do criador</h1>
      <p class="sub" id="quem">Tesouraria · leitura e exclusão</p>
    </div>
    <div id="acoes"></div>
  </header>
  <main id="app"></main>

  <div id="modalRoot" class="modal-bg hidden">
    <div class="modal">
      <h4 id="modalTitle">Confirmar</h4>
      <p id="modalMsg"></p>
      <div class="modal-actions">
        <button class="btn-ghost" id="modalCancel">Cancelar</button>
        <button class="btn-danger" id="modalOk">Excluir</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      deleteDoc,
      query,
      where,
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const EMAILS_PERMITIDOS = ["hupcontato@gmail.com"];

    const firebaseConfig = {
      apiKey: "AIzaSyDJFnhKXoUqKSIzsffYWkJ7qGIuEUhlUFs",
      authDomain: "psh-admin-8c0f7.firebaseapp.com",
      projectId: "psh-admin-8c0f7",
      storageBucket: "psh-admin-8c0f7.firebasestorage.app",
      messagingSenderId: "53234150017",
      appId: "1:53234150017:web:6e64b2536d79dff74b7b80",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const root = document.getElementById("app");
    const acoes = document.getElementById("acoes");
    const quem = document.getElementById("quem");
    const modalRoot = document.getElementById("modalRoot");
    const modalTitle = document.getElementById("modalTitle");
    const modalMsg = document.getElementById("modalMsg");
    const modalCancel = document.getElementById("modalCancel");
    const modalOk = document.getElementById("modalOk");

    let cache = { igrejas: [], membros: [], registros: [] };
    let pendingAction = null;
    let selectedKey = null;

    const money = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL",
    });

    function emailOk(user) {
      const e = String(user?.email || "").trim().toLowerCase();
      return EMAILS_PERMITIDOS.map((x) => x.toLowerCase()).includes(e);
    }

    function dataTxt(ts) {
      const n = Number(ts) || 0;
      if (!n) return "—";
      const d = new Date(n);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleString("pt-BR");
    }

    function tsDe(item) {
      return Number(item?.reg || item?.data || item?.createdAt || 0) || 0;
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function valorRegistro(r) {
      if (r?.tipoMovimento === "saida") {
        return Number(r.valorPagoTotal || r.valorTotal || 0) || 0;
      }
      return Number(r.valorRecebidoTotal || r.valorTotal || 0) || 0;
    }

    function nomeIgrejaPorId(id, mapa) {
      if (!id) return { nome: "Sem igreja", orfao: true };
      const n = mapa.get(id);
      if (n) return { nome: n, orfao: false };
      return { nome: "Igreja não encontrada", orfao: true, id };
    }

    function abrirModal(titulo, mensagem, onConfirm) {
      modalTitle.textContent = titulo;
      modalMsg.textContent = mensagem;
      pendingAction = onConfirm;
      modalRoot.classList.remove("hidden");
    }

    function fecharModal() {
      pendingAction = null;
      modalRoot.classList.add("hidden");
    }

    modalCancel.onclick = () => fecharModal();
    modalOk.onclick = async () => {
      const fn = pendingAction;
      fecharModal();
      if (fn) {
        try {
          await fn();
        } catch (e) {
          alert("Erro: " + (e?.message || e?.code || "falha"));
        }
      }
    };
    modalRoot.addEventListener("click", (e) => {
      if (e.target === modalRoot) fecharModal();
    });

    async function apagarQuery(colName, field, value) {
      const q = query(collection(db, colName), where(field, "==", value));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
      return snap.size;
    }

    async function excluirIgrejaCompleta(igrejaId, nome) {
      if (!igrejaId) return;
      const nM = await apagarQuery("membros", "igrejaId", igrejaId);
      const nR = await apagarQuery("registros", "igrejaId", igrejaId);
      try {
        await apagarQuery("caixinhas", "igrejaId", igrejaId);
      } catch (_) {}
      await deleteDoc(doc(db, "igrejas", igrejaId));
      selectedKey = null;
      await carregar(true);
      alert(
        'Igreja "' + nome + '" excluída.\nMembros: ' + nM + "\nRegistros: " + nR
      );
    }

    async function excluirRegistro(regId) {
      if (!regId) return;
      await deleteDoc(doc(db, "registros", regId));
      selectedKey = null;
      await carregar(true);
    }

    async function excluirMembro(membroId) {
      if (!membroId) return;
      await deleteDoc(doc(db, "membros", membroId));
      selectedKey = null;
      await carregar(true);
    }

    async function entrar() {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    }

    async function sair() {
      await signOut(auth);
    }

    function telaLogin(msg) {
      acoes.innerHTML = "";
      quem.textContent = "Tesouraria · leitura e exclusão";
      root.innerHTML =
        '<section class="login">' +
        "<h2>Acesso do criador</h2>" +
        "<p>Entre com a conta Google autorizada.</p>" +
        (msg ? '<div class="aviso">' + esc(msg) + "</div>" : "") +
        '<button class="btn" id="btnEntrar" style="width:100%;height:48px;margin-top:8px">Entrar com Google</button>' +
        "</section>";
      document.getElementById("btnEntrar").onclick = () =>
        entrar().catch((e) =>
          telaLogin(e?.message || "Não foi possível entrar.")
        );
    }

    function bindSelectAndDelete() {
      root.querySelectorAll("[data-select]").forEach((el) => {
        el.addEventListener("click", (e) => {
          if (
            e.target.closest(
              "[data-del-igreja],[data-del-reg],[data-del-membro]"
            )
          ) {
            return;
          }
          const key = el.getAttribute("data-select");
          selectedKey = selectedKey === key ? null : key;
          render(cache);
        });
      });

      root.querySelectorAll("[data-del-igreja]").forEach((btn) => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-del-igreja");
          const nome = btn.getAttribute("data-nome") || id;
          abrirModal(
            "Excluir igreja",
            'Isso apaga a igreja "' +
              nome +
              '", todos os membros, registros e caixinhas ligados a ela. Não dá para desfazer pelo painel.',
            () => excluirIgrejaCompleta(id, nome)
          );
        };
      });

      root.querySelectorAll("[data-del-reg]").forEach((btn) => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-del-reg");
          abrirModal(
            "Excluir registro",
            "Remover este registro do Firestore? Ação imediata.",
            () => excluirRegistro(id)
          );
        };
      });

      root.querySelectorAll("[data-del-membro]").forEach((btn) => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = btn.getAttribute("data-del-membro");
          abrirModal(
            "Remover membro",
            "Remove o vínculo deste e-mail com a igreja. A conta do Authentication não é apagada.",
            () => excluirMembro(id)
          );
        };
      });
    }

    function render(data) {
      const { igrejas, membros, registros } = data;
      const mapaNome = new Map(
        igrejas.map((i) => [i.id, i.nome || "Igreja"])
      );

      const membrosPorIgreja = {};
      membros.forEach((m) => {
        const id = m.igrejaId || "—";
        membrosPorIgreja[id] = (membrosPorIgreja[id] || 0) + 1;
      });

      const ultimoPorIgreja = {};
      const orfaos = [];

      registros.forEach((r) => {
        const ts = tsDe(r);
        const id = r.igrejaId || "";
        if (!id || !mapaNome.has(id)) {
          orfaos.push(r);
          return;
        }
        if (!ultimoPorIgreja[id] || ts > ultimoPorIgreja[id].ts) {
          ultimoPorIgreja[id] = { ts, item: r };
        }
      });

      const ultimoGeral = registros.reduce((acc, r) => {
        const ts = tsDe(r);
        if (!acc || ts > acc.ts) return { ts, item: r };
        return acc;
      }, null);

      const ult = ultimoGeral?.item;
      const infoIgrejaUlt = nomeIgrejaPorId(ult?.igrejaId, mapaNome);
      const ultValor = ult ? valorRegistro(ult) : 0;
      const keyUlt = ult?.id ? "reg:" + ult.id : null;
      const selUlt = keyUlt && selectedKey === keyUlt;

      let avisoInconsistencia = "";
      if (ult && infoIgrejaUlt.orfao) {
        avisoInconsistencia =
          "O último lançamento (" +
          dataTxt(ultimoGeral.ts) +
          ") aponta para uma igreja que não existe na coleção igrejas (ID: " +
          (ult.igrejaId || "vazio") +
          "). Por isso ele não aparece na lista de igrejas.";
      }

      const linhasIgreja = igrejas
        .map((ig) => {
          const ultIg = ultimoPorIgreja[ig.id];
          return {
            id: ig.id,
            nome: ig.nome || "Igreja",
            membros: membrosPorIgreja[ig.id] || 0,
            ultimo: ultIg?.ts || 0,
            tipo: ultIg?.item?.tipo || "—",
            desc: ultIg?.item?.descricao || "—",
            exclusao: Number(ig.exclusaoPrevistaEm) || 0,
          };
        })
        .sort((a, b) => b.ultimo - a.ultimo);

      const membrosLinhas = membros
        .map((m) => {
          const info = nomeIgrejaPorId(m.igrejaId, mapaNome);
          return {
            id: m.id,
            email: m.email || m.uid || "—",
            papel: m.papel || "—",
            igreja: info.nome,
            orfao: info.orfao,
            igrejaId: m.igrejaId || "",
          };
        })
        .sort((a, b) => String(a.email).localeCompare(String(b.email)));

      root.innerHTML =
        '<div class="grid">' +
        '<div class="kpi"><span>Igrejas</span><strong>' +
        igrejas.length +
        "</strong></div>" +
        '<div class="kpi"><span>Membros</span><strong>' +
        membros.length +
        "</strong></div>" +
        '<div class="kpi"><span>Registros</span><strong>' +
        registros.length +
        "</strong></div>" +
        '<div class="kpi ' +
        (orfaos.length ? "warn" : "") +
        '"><span>Registros órfãos</span><strong>' +
        orfaos.length +
        "</strong></div>" +
        "</div>" +
        (avisoInconsistencia
          ? '<div class="aviso">' + esc(avisoInconsistencia) + "</div>"
          : "") +
        (orfaos.length
          ? '<div class="aviso">Há ' +
            orfaos.length +
            " registro(s) com igreja inexistente ou sem igrejaId.</div>"
          : '<div class="ok">Nenhum registro órfão detectado.</div>') +
        "<h3>Último lançamento</h3>" +
        '<p class="hint-select">Toque no card para selecionar e só então ver o botão de excluir.</p>' +
        (ult
          ? '<button type="button" class="item' +
            (selUlt ? " selected" : "") +
            '" data-select="' +
            esc(keyUlt) +
            '">' +
            '<div class="item-top">' +
            '<div class="item-title">' +
            esc(ult.descricao || ult.tipo || "Lançamento") +
            "</div>" +
            '<div class="item-side">' +
            esc(dataTxt(ultimoGeral.ts)) +
            "</div>" +
            "</div>" +
            '<div class="item-meta">' +
            "<div><strong>" +
            esc(infoIgrejaUlt.nome) +
            "</strong></div>" +
            "<div>" +
            esc(ult.tipoMovimento || "—") +
            " · " +
            esc(ult.tipo || "—") +
            "</div>" +
            "<div>" +
            money.format(ultValor) +
            "</div>" +
            (infoIgrejaUlt.orfao
              ? '<div class="tag">órfão · ID ' +
                esc(infoIgrejaUlt.id || ult.igrejaId || "—") +
                "</div>"
              : "") +
            "</div>" +
            '<div class="item-actions">' +
            '<button type="button" class="btn-danger btn-sm" data-del-reg="' +
            esc(ult.id) +
            '">Excluir este registro</button>' +
            "</div>" +
            "</button>"
          : '<div class="empty">Nenhum lançamento.</div>') +
        "<h3>Igrejas</h3>" +
        '<p class="hint-select">Toque em uma igreja para selecionar e mostrar Excluir.</p>' +
        '<div class="list">' +
        (linhasIgreja.length
          ? linhasIgreja
              .map((ig) => {
                const key = "igreja:" + ig.id;
                const sel = selectedKey === key;
                return (
                  '<button type="button" class="item' +
                  (sel ? " selected" : "") +
                  '" data-select="' +
                  esc(key) +
                  '">' +
                  '<div class="item-top">' +
                  '<div class="item-title">' +
                  esc(ig.nome) +
                  "</div>" +
                  '<div class="item-side">' +
                  ig.membros +
                  " membro(s)</div>" +
                  "</div>" +
                  '<div class="item-meta">' +
                  "<div>Último: " +
                  esc(dataTxt(ig.ultimo)) +
                  "</div>" +
                  "<div>" +
                  esc(ig.tipo) +
                  " · " +
                  esc(ig.desc) +
                  "</div>" +
                  '<div class="muted">' +
                  esc(ig.id) +
                  "</div>" +
                  (ig.exclusao
                    ? '<div class="tag">exclusão prevista ' +
                      esc(dataTxt(ig.exclusao)) +
                      "</div>"
                    : "") +
                  "</div>" +
                  '<div class="item-actions">' +
                  '<button type="button" class="btn-danger btn-sm" data-del-igreja="' +
                  esc(ig.id) +
                  '" data-nome="' +
                  esc(ig.nome) +
                  '">Excluir igreja</button>' +
                  "</div>" +
                  "</button>"
                );
              })
              .join("")
          : '<div class="empty">Nenhuma igreja.</div>') +
        "</div>" +
        (orfaos.length
          ? "<h3>Registros órfãos</h3>" +
            '<p class="hint-select">Toque no item para selecionar e excluir.</p>' +
            '<div class="list">' +
            orfaos
              .sort((a, b) => tsDe(b) - tsDe(a))
              .map((r) => {
                const key = "reg:" + r.id;
                const sel = selectedKey === key;
                return (
                  '<button type="button" class="item' +
                  (sel ? " selected" : "") +
                  '" data-select="' +
                  esc(key) +
                  '">' +
                  '<div class="item-top">' +
                  '<div class="item-title">' +
                  esc(r.descricao || r.tipo || "Registro") +
                  "</div>" +
                  '<div class="item-side">' +
                  esc(dataTxt(tsDe(r))) +
                  "</div>" +
                  "</div>" +
                  '<div class="item-meta">' +
                  "<div>" +
                  esc(r.tipoMovimento || "—") +
                  " · " +
                  esc(r.tipo || "—") +
                  "</div>" +
                  "<div>" +
                  money.format(valorRegistro(r)) +
                  "</div>" +
                  '<div class="tag">ID ' +
                  esc(r.id || "—") +
                  "</div>" +
                  "</div>" +
                  '<div class="item-actions">' +
                  '<button type="button" class="btn-danger btn-sm" data-del-reg="' +
                  esc(r.id) +
                  '">Excluir registro</button>' +
                  "</div>" +
                  "</button>"
                );
              })
              .join("") +
            "</div>"
          : "") +
        "<h3>Membros</h3>" +
        '<p class="hint-select">Toque no membro para selecionar e mostrar Remover.</p>' +
        '<div class="list">' +
        (membrosLinhas.length
          ? membrosLinhas
              .map((m) => {
                const key = "membro:" + m.id;
                const sel = selectedKey === key;
                return (
                  '<button type="button" class="item' +
                  (sel ? " selected" : "") +
                  '" data-select="' +
                  esc(key) +
                  '">' +
                  '<div class="item-top">' +
                  '<div class="item-title">' +
                  esc(m.email) +
                  "</div>" +
                  '<div class="item-side">' +
                  esc(m.papel) +
                  "</div>" +
                  "</div>" +
                  '<div class="item-meta">' +
                  "<div>" +
                  esc(m.igreja) +
                  "</div>" +
                  (m.orfao ? '<div class="tag">igreja órfã</div>' : "") +
                  "</div>" +
                  '<div class="item-actions">' +
                  '<button type="button" class="btn-danger btn-sm" data-del-membro="' +
                  esc(m.id) +
                  '">Remover membro</button>' +
                  "</div>" +
                  "</button>"
                );
              })
              .join("")
          : '<div class="empty">Nenhum membro.</div>') +
        "</div>";

      bindSelectAndDelete();
    }

    async function carregar(silencioso) {
      if (!silencioso) root.innerHTML = '<p class="muted">Carregando…</p>';
      const [igrejasSnap, membrosSnap, registrosSnap] = await Promise.all([
        getDocs(collection(db, "igrejas")),
        getDocs(collection(db, "membros")),
        getDocs(collection(db, "registros")),
      ]);

      cache = {
        igrejas: igrejasSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
        membros: membrosSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
        registros: registrosSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      };
      render(cache);
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        telaLogin("");
        return;
      }
      if (!emailOk(user)) {
        await sair();
        telaLogin("Esta conta não tem acesso ao painel.");
        return;
      }
      quem.textContent = user.email;
      acoes.innerHTML =
        '<button class="btn-ghost" id="btnRefresh">Atualizar</button>' +
        '<button class="btn-ghost" id="btnSair">Sair</button>';
      document.getElementById("btnSair").onclick = () => sair();
      document.getElementById("btnRefresh").onclick = () => carregar();
      try {
        await carregar();
      } catch (e) {
        root.innerHTML =
          '<div class="err">Não foi possível ler os dados (' +
          esc(e?.code || e?.message || "erro") +
          "). Confira regras do Firestore e Authorized domains.</div>";
      }
    });
  </script>
</body>
</html>
