<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Painel · Tesouraria (Dark)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-body: #0f172a;       /* Slate 900 */
      --bg-surface: #1e293b;    /* Slate 800 */
      --border: #334155;        /* Slate 700 */
      
      --text-main: #f8fafc;     /* Slate 50 */
      --text-muted: #94a3b8;    /* Slate 400 */
      --text-light: #64748b;    /* Slate 500 */

      --primary: #10b981;       /* Emerald 500 */
      --primary-dark: #059669;  /* Emerald 600 */
      --primary-light: rgba(16, 185, 129, 0.15);

      --danger: #ef4444;        /* Red 500 */
      --danger-light: rgba(239, 68, 68, 0.15);

      --warning: #f59e0b;       /* Amber 500 */
      --warning-light: rgba(245, 158, 11, 0.15);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Mobile */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    }
    
    .top-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-info {
      min-width: 0;
    }

    .brand-info h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .brand-info .user-email {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Conteúdo Principal */
    main {
      flex: 1;
      width: 100%;
      padding: 16px;
      padding-bottom: max(80px, calc(65px + env(safe-area-inset-bottom)));
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 56px;
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 100%;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s ease;
    }

    .tab svg {
      width: 20px;
      height: 20px;
      transition: transform 0.15s ease;
    }

    .tab.active {
      color: var(--primary);
      font-weight: 700;
    }

    .tab.active svg {
      transform: translateY(-1px);
    }

    /* Botões */
    button { 
      font-family: 'Inter', sans-serif; 
      border: 0; 
      cursor: pointer; 
      user-select: none;
    }
    
    .btn {
      height: 36px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .btn:active {
      transform: scale(0.97);
      background: #273548;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #0f172a;
    }
    
    .btn-primary:active {
      background: var(--primary-dark);
    }

    .btn-danger {
      background: var(--danger-light);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .btn-block {
      width: 100%;
      height: 48px;
      font-size: 15px;
      border-radius: var(--radius-md);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: #0f172a;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .icon-btn:active {
      background: var(--danger-light);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Tela de Login */
    .login-container {
      padding-top: 40px;
    }

    .login {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 20px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .login-logo {
      width: 48px;
      height: 48px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .login h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .login p {
      margin: 0 0 20px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.4;
    }

    /* KPIs */
    .kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .kpi {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
    }

    .kpi label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .kpi strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .kpi.warn {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
    }

    .kpi.warn strong { color: var(--warning); }

    /* Banners */
    .banner {
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.3;
    }

    .banner.ok { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; }
    .banner.warn { background: var(--warning-light); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; }
    .banner.err { background: var(--danger-light); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    /* Cards */
    .stack { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .card-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .card-body { flex: 1; min-width: 0; }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
      word-break: break-word;
    }

    .card-sub {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.3;
      word-break: break-word;
    }

    .card-foot {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-valor {
      font-weight: 700;
      color: var(--text-main);
      font-size: 14px;
    }

    /* Badges */
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .pill.alert {
      background: var(--warning-light);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .empty {
      background: var(--bg-surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    .hidden { display: none !important; }

    /* Modal / Bottom Sheet */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      padding: 20px 20px max(20px, env(safe-area-inset-bottom));
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal h3 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal p {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .modal-actions .btn {
      height: 44px;
      flex: 1;
      font-size: 14px;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>

  <!-- Header Fixo -->
  <header class="top-header">
    <div class="top-container">
      <div class="brand-section">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="brand-info">
          <h1>Tesouraria</h1>
          <p class="user-email" id="quem">Acesso Restrito</p>
        </div>
      </div>
      <div class="top-actions" id="acoes"></div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main id="app"></main>

  <!-- Navegação Inferior -->
  <nav class="bottom-nav">
    <div class="tabs hidden" id="tabs">
      <button type="button" class="tab active" data-tab="resumo">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Resumo</span>
      </button>
      <button type="button" class="tab" data-tab="igrejas">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m3 0v-4a1 1 0 011-1h2a1 1 0 011 1v4m-4 0h4"/></svg>
        <span>Igrejas</span>
      </button>
      <button type="button" class="tab" data-tab="membros">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <span>Membros</span>
      </button>
      <button type="button" class="tab hidden" data-tab="orfaos" id="tabOrfaos">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span>Órfãos</span>
      </button>
    </div>
  </nav>

  <!-- Modal -->
  <div id="modalRoot" class="modal-bg hidden">
    <div class="modal">
      <h3 id="modalTitle">Confirmar Ação</h3>
      <p id="modalMsg">Tem certeza que deseja continuar?</p>
      <div class="modal-actions">
        <button type="button" class="btn" id="modalCancel">Cancelar</button>
        <button type="button" class="btn btn-danger" id="modalOk">Excluir</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      deleteDoc,
      query,
      where,
    } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const EMAILS_PERMITIDOS = ["hupcontato@gmail.com"];
    const QTD_ULTIMOS = 3;

    const firebaseConfig = {
      apiKey: "AIzaSyDJFnhKXoUqKSIzsffYWkJ7qGIuEUhlUFs",
      authDomain: "psh-admin-8c0f7.firebaseapp.com",
      projectId: "psh-admin-8c0f7",
      storageBucket: "psh-admin-8c0f7.firebasestorage.app",
      messagingSenderId: "53234150017",
      appId: "1:53234150017:web:6e64b2536d79dff74b7b80",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const root = document.getElementById("app");
    const acoes = document.getElementById("acoes");
    const quem = document.getElementById("quem");
    const tabsEl = document.getElementById("tabs");
    const tabOrfaos = document.getElementById("tabOrfaos");
    const modalRoot = document.getElementById("modalRoot");
    const modalTitle = document.getElementById("modalTitle");
    const modalMsg = document.getElementById("modalMsg");
    const modalCancel = document.getElementById("modalCancel");
    const modalOk = document.getElementById("modalOk");

    let cache = { igrejas: [], membros: [], registros: [] };
    let pendingAction = null;
    let tabAtual = "resumo";

    const money = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL",
    });

    function emailOk(user) {
      const e = String(user?.email || "").trim().toLowerCase();
      return EMAILS_PERMITIDOS.map((x) => x.toLowerCase()).includes(e);
    }

    function dataTxt(ts) {
      const n = Number(ts) || 0;
      if (!n) return "—";
      const d = new Date(n);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleString("pt-BR", {
        day: "2-digit",
        month: "2-digit",
        year: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function tsDe(item) {
      return Number(item?.reg || item?.data || item?.createdAt || 0) || 0;
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function valorRegistro(r) {
      if (r?.tipoMovimento === "saida") {
        return Number(r.valorPagoTotal || r.valorTotal || 0) || 0;
      }
      return Number(r.valorRecebidoTotal || r.valorTotal || 0) || 0;
    }

    function nomeIgrejaPorId(id, mapa) {
      if (!id) return { nome: "Sem igreja", orfao: true };
      const n = mapa.get(id);
      if (n) return { nome: n, orfao: false };
      return { nome: "Igreja não encontrada", orfao: true, id };
    }

    function iconTrash() {
      return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
    }

    function abrirModal(titulo, mensagem, onConfirm) {
      modalTitle.textContent = titulo;
      modalMsg.textContent = mensagem;
      pendingAction = onConfirm;
      modalRoot.classList.remove("hidden");
    }

    function fecharModal() {
      pendingAction = null;
      modalRoot.classList.add("hidden");
    }

    modalCancel.onclick = () => fecharModal();
    modalOk.onclick = async () => {
      const fn = pendingAction;
      fecharModal();
      if (!fn) return;
      try {
        await fn();
      } catch (e) {
        alert("Erro: " + (e?.message || e?.code || "falha"));
      }
    };
    modalRoot.addEventListener("click", (e) => {
      if (e.target === modalRoot) fecharModal();
    });

    async function apagarQuery(colName, field, value) {
      const q = query(collection(db, colName), where(field, "==", value));
      const snap = await getDocs(q);
      await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
      return snap.size;
    }

    async function excluirIgrejaCompleta(igrejaId, nome) {
      if (!igrejaId) return;
      const nM = await apagarQuery("membros", "igrejaId", igrejaId);
      const nR = await apagarQuery("registros", "igrejaId", igrejaId);
      try {
        await apagarQuery("caixinhas", "igrejaId", igrejaId);
      } catch (_) {}
      await deleteDoc(doc(db, "igrejas", igrejaId));
      await carregar(true);
      alert('Igreja "' + nome + '" excluída.\nMembros: ' + nM + "\nRegistros: " + nR);
    }

    async function excluirRegistro(regId) {
      if (!regId) return;
      await deleteDoc(doc(db, "registros", regId));
      await carregar(true);
    }

    async function excluirMembro(membroId) {
      if (!membroId) return;
      await deleteDoc(doc(db, "membros", membroId));
      await carregar(true);
    }

    async function entrar() {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    }

    async function sair() {
      await signOut(auth);
    }

    function telaLogin(msg) {
      tabsEl.classList.add("hidden");
      acoes.innerHTML = "";
      quem.textContent = "Acesso Restrito";
      root.innerHTML =
        '<div class="login-container">' +
        '<section class="login">' +
        '<div class="login-logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>' +
        "<h2>Painel de Gestão</h2>" +
        "<p>Entre com uma conta Google autorizada.</p>" +
        (msg ? '<div class="banner warn">' + esc(msg) + "</div>" : "") +
        '<button type="button" class="btn btn-primary btn-block" id="btnEntrar">Entrar com Google</button>' +
        "</section>" +
        "</div>";
      document.getElementById("btnEntrar").onclick = () =>
        entrar().catch((e) =>
          telaLogin(e?.message || "Não foi possível entrar.")
        );
    }

    function prepararDados() {
      const { igrejas, membros, registros } = cache;
      const mapaNome = new Map(igrejas.map((i) => [i.id, i.nome || "Igreja"]));

      const membrosPorIgreja = {};
      membros.forEach((m) => {
        const id = m.igrejaId || "—";
        membrosPorIgreja[id] = (membrosPorIgreja[id] || 0) + 1;
      });

      const ultimoPorIgreja = {};
      const orfaos = [];

      registros.forEach((r) => {
        const ts = tsDe(r);
        const id = r.igrejaId || "";
        if (!id || !mapaNome.has(id)) {
          orfaos.push(r);
          return;
        }
        if (!ultimoPorIgreja[id] || ts > ultimoPorIgreja[id].ts) {
          ultimoPorIgreja[id] = { ts, item: r };
        }
      });

      const ultimos = [...registros]
        .sort((a, b) => tsDe(b) - tsDe(a))
        .slice(0, QTD_ULTIMOS);

      const linhasIgreja = igrejas
        .map((ig) => {
          const ultIg = ultimoPorIgreja[ig.id];
          return {
            id: ig.id,
            nome: ig.nome || "Igreja",
            membros: membrosPorIgreja[ig.id] || 0,
            ultimo: ultIg?.ts || 0,
            tipo: ultIg?.item?.tipo || "—",
            desc: ultIg?.item?.descricao || "—",
            exclusao: Number(ig.exclusaoPrevistaEm) || 0,
          };
        })
        .sort((a, b) => b.ultimo - a.ultimo);

      const membrosLinhas = membros
        .map((m) => {
          const info = nomeIgrejaPorId(m.igrejaId, mapaNome);
          return {
            id: m.id,
            email: m.email || m.uid || "—",
            papel: m.papel || "—",
            igreja: info.nome,
            orfao: info.orfao,
          };
        })
        .sort((a, b) => String(a.email).localeCompare(String(b.email)));

      orfaos.sort((a, b) => tsDe(b) - tsDe(a));

      return {
        mapaNome,
        orfaos,
        ultimos,
        linhasIgreja,
        membrosLinhas,
      };
    }

    function bindDeletes() {
      root.querySelectorAll("[data-del-igreja]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-del-igreja");
          const nome = btn.getAttribute("data-nome") || id;
          abrirModal(
            "Excluir igreja?",
            'Vai apagar "' + nome + '" e todos os seus vínculos.',
            () => excluirIgrejaCompleta(id, nome)
          );
        };
      });

      root.querySelectorAll("[data-del-reg]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-del-reg");
          abrirModal(
            "Excluir registro?",
            "Este lançamento será removido imediatamente.",
            () => excluirRegistro(id)
          );
        };
      });

      root.querySelectorAll("[data-del-membro]").forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-del-membro");
          abrirModal(
            "Remover membro?",
            "Só remove o vínculo com a igreja.",
            () => excluirMembro(id)
          );
        };
      });
    }

    function cardLancamento(item, mapaNome) {
      const info = nomeIgrejaPorId(item.igrejaId, mapaNome);
      return (
        '<div class="card">' +
        '<div class="card-row">' +
        '<div class="card-body">' +
        '<div class="card-title">' + esc(item.descricao || item.tipo || "Lançamento") + '</div>' +
        '<div class="card-sub">' + esc(info.nome) + " · " + esc(item.tipoMovimento || "—") + '</div>' +
        '</div>' +
        '<button type="button" class="icon-btn" data-del-reg="' + esc(item.id) + '" title="Excluir">' + iconTrash() + '</button>' +
        '</div>' +
        '<div class="card-foot">' +
        '<span>' + esc(dataTxt(tsDe(item))) + '</span>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        '<span class="card-valor">' + money.format(valorRegistro(item)) + '</span>' +
        (info.orfao ? '<span class="pill alert">órfão</span>' : '') +
        '</div>' +
        '</div>' +
        '</div>'
      );
    }

    function renderResumo(prep) {
      const { orfaos, ultimos, mapaNome } = prep;
      const { igrejas, membros, registros } = cache;

      let html =
        '<div class="kpis">' +
        '<div class="kpi"><label>Igrejas</label><strong>' + igrejas.length + '</strong></div>' +
        '<div class="kpi"><label>Membros</label><strong>' + membros.length + '</strong></div>' +
        '<div class="kpi"><label>Registros</label><strong>' + registros.length + '</strong></div>' +
        '<div class="kpi' + (orfaos.length ? " warn" : "") + '"><label>Órfãos</label><strong>' + orfaos.length + '</strong></div>' +
        '</div>';

      if (orfaos.length) {
        html += '<div class="banner warn">Existem registros desvinculados de igrejas.</div>';
      } else {
        html += '<div class="banner ok">Nenhum registro órfão.</div>';
      }

      html += '<div class="section-title">Últimos Lançamentos</div>';

      if (!ultimos.length) {
        html += '<div class="empty">Nenhum lançamento até o momento.</div>';
      } else {
        html += '<div class="stack">' + ultimos.map((item) => cardLancamento(item, mapaNome)).join("") + '</div>';
      }

      return html;
    }

    function renderIgrejas(prep) {
      const list = prep.linhasIgreja;
      if (!list.length) return '<div class="empty">Nenhuma igreja cadastrada.</div>';

      return (
        '<div class="stack">' +
        list
          .map((ig) => {
            return (
              '<div class="card">' +
              '<div class="card-row">' +
              '<div class="card-body">' +
              '<div class="card-title">' + esc(ig.nome) + '</div>' +
              '<div class="card-sub">' + ig.membros + ' membro(s)</div>' +
              '</div>' +
              '<button type="button" class="icon-btn" data-del-igreja="' + esc(ig.id) + '" data-nome="' + esc(ig.nome) + '" title="Excluir">' + iconTrash() + '</button>' +
              '</div>' +
              '<div class="card-foot">' +
              '<span>Último: ' + esc(dataTxt(ig.ultimo)) + '</span>' +
              (ig.exclusao ? '<span class="pill alert">Exclui ' + esc(dataTxt(ig.exclusao)) + '</span>' : '') +
              '</div>' +
              '</div>'
            );
          })
          .join("") +
        '</div>'
      );
    }

    function renderMembros(prep) {
      const list = prep.membrosLinhas;
      if (!list.length) return '<div class="empty">Nenhum membro.</div>';

      return (
        '<div class="stack">' +
        list
          .map((m) => {
            return (
              '<div class="card">' +
              '<div class="card-row">' +
              '<div class="card-body">' +
              '<div class="card-title">' + esc(m.email) + '</div>' +
              '<div class="card-sub">' + esc(m.igreja) + '</div>' +
              '</div>' +
              '<button type="button" class="icon-btn" data-del-membro="' + esc(m.id) + '" title="Remover">' + iconTrash() + '</button>' +
              '</div>' +
              '<div class="card-foot">' +
              '<span class="pill">' + esc(m.papel) + '</span>' +
              (m.orfao ? '<span class="pill alert">Sem igreja</span>' : '') +
              '</div>' +
              '</div>'
            );
          })
          .join("") +
        '</div>'
      );
    }

    function renderOrfaos(prep) {
      const list = prep.orfaos;
      if (!list.length) return '<div class="empty">Nenhum registro órfão.</div>';

      return (
        '<div class="banner warn">Lançamentos sem igreja válida.</div>' +
        '<div class="stack">' +
        list.map((r) => cardLancamento(r, prep.mapaNome)).join("") +
        '</div>'
      );
    }

    function render() {
      const prep = prepararDados();

      if (prep.orfaos.length) {
        tabOrfaos.classList.remove("hidden");
        tabOrfaos.querySelector("span").textContent = "Órfãos (" + prep.orfaos.length + ")";
      } else {
        tabOrfaos.classList.add("hidden");
        if (tabAtual === "orfaos") tabAtual = "resumo";
      }

      tabsEl.querySelectorAll(".tab").forEach((t) => {
        t.classList.toggle("active", t.getAttribute("data-tab") === tabAtual);
      });

      if (tabAtual === "igrejas") root.innerHTML = renderIgrejas(prep);
      else if (tabAtual === "membros") root.innerHTML = renderMembros(prep);
      else if (tabAtual === "orfaos") root.innerHTML = renderOrfaos(prep);
      else root.innerHTML = renderResumo(prep);

      bindDeletes();
    }

    tabsEl.querySelectorAll(".tab").forEach((t) => {
      t.onclick = () => {
        tabAtual = t.getAttribute("data-tab");
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    });

    async function carregar(silencioso) {
      if (!silencioso) {
        root.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px;">Carregando...</div>';
      }
      const [igrejasSnap, membrosSnap, registrosSnap] = await Promise.all([
        getDocs(collection(db, "igrejas")),
        getDocs(collection(db, "membros")),
        getDocs(collection(db, "registros")),
      ]);

      cache = {
        igrejas: igrejasSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
        membros: membrosSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
        registros: registrosSnap.docs.map((d) => ({ id: d.id, ...d.data() })),
      };
      render();
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        telaLogin("");
        return;
      }
      if (!emailOk(user)) {
        await sair();
        telaLogin("Conta não autorizada.");
        return;
      }

      quem.textContent = user.email || "";
      tabsEl.classList.remove("hidden");
      acoes.innerHTML =
        '<button type="button" class="btn" id="btnRefresh" title="Atualizar"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>' +
        '<button type="button" class="btn btn-danger" id="btnSair">Sair</button>';
      document.getElementById("btnSair").onclick = () => sair();
      document.getElementById("btnRefresh").onclick = () => carregar();

      try {
        await carregar();
      } catch (e) {
        root.innerHTML = '<div class="banner err">Erro ao carregar dados.</div>';
      }
    });
  </script>
</body>
</html>
